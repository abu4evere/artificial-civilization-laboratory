# Their world on Fly.io, running day and night.
#
# COST, stated plainly: Fly has no free tier. One shared-cpu-1x machine with
# 256MB, running all the time, is about $1.94 per 30 days, plus $0.15 per GB per
# month for the 1GB volume that holds the world. About $2.10 a month in total.
# Unlike a normal web app it must never be stopped, or their time would stand
# still, so auto-stop is off and one machine always runs.

app = "acl-world"              # change if the name is taken
primary_region = "fra"         # Frankfurt, the same region as Unstuck

[build]

[mounts]
  source = "acl_world"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
