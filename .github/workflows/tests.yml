# Runs ACL's tests on every push and pull request:
# the laws of the World Bible (tests/test_laws.py), property tests on many random worlds (tests/test_properties.py),
# the viewer, and the reproducibility guard (tests/test_reference_replays.py), which replays reference worlds of ACL's
# own code and of the experiments' frozen control copy and checks they reach exactly the recorded state.
#
# Windows and Python 3.14, the system the reference hashes were made on: maths functions can differ in the last digit
# between systems, which could change a rare choice and fail the replay check for no real reason.
name: tests

# Only when code changes: book, roadmap and results commits do not use the private repo's Actions minutes
# (Windows minutes count double on GitHub's free plan).
on:
  push:
    paths: ["acl/**", "tests/**", "experiments/**/code_*/**", ".github/workflows/**", "pyproject.toml"]
  pull_request:
    paths: ["acl/**", "tests/**", "experiments/**/code_*/**", ".github/workflows/**", "pyproject.toml"]
  workflow_dispatch:   # can also be started by hand from the Actions tab

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test tools
        run: python -m pip install pytest hypothesis
      - name: Run tests
        run: python -m pytest -q
