# Runs ACL's tests on every push and pull request:
# the laws of the World Bible (tests/test_laws.py), property tests on many random worlds (tests/test_properties.py),
# the viewer, and the reproducibility guard (tests/test_reference_replays.py), which replays reference worlds of ACL's
# own code and of the experiments' frozen control copy and checks they reach exactly the recorded state.
#
# Windows and Python 3.14, the system the reference hashes were made on: maths functions can differ in the last digit
# between systems, which could change a rare choice and fail the replay check for no real reason.
name: tests

# Only when code changes: book, roadmap and results commits do not use the private repo's Actions minutes
# (Windows minutes count double on GitHub's free plan).
on:
  push:
    branches: ["**"]   # branches only: pushing a tag (e.g. BL0-frozen) does not run the tests again
    paths: ["acl/**", "tests/**", "experiments/**/code_*/**", ".github/workflows/**", "pyproject.toml"]
  pull_request:
    paths: ["acl/**", "tests/**", "experiments/**/code_*/**", ".github/workflows/**", "pyproject.toml"]
  workflow_dispatch:   # can also be started by hand from the Actions tab

jobs:
  test:
    # Windows Server 2022, not windows-latest (Server 2025): Windows' own C maths library differs between builds in the
    # last digit of pow(). Traced on 12 Oct 2026 (tools/ci/replay_trace.py): the frozen control world, seed 11, matched
    # this PC (Windows 10, build 19045) on Server 2022 but parted on Server 2025 at week 121, where one memory strength
    # ended ...782 here and ...781 there. Exact replays of ACL hold only where that library gives the same results.
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"   # exactly the version the reference hashes were made with: a newer patch release
                                     # can change a maths result in its last digit and so the course of a world
      - name: Install test tools
        run: |
          python -VV
          python -m pip install pytest hypothesis
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rfE --tb=short 2>&1 | tee pytest_out.txt
      - name: Put the failure on the run page
        if: failure()
        shell: bash
        run: |
          { echo "## Test failure (last 80 lines)"; echo '```'; tail -n 80 pytest_out.txt 2>/dev/null || echo "no test output: the failure was before the tests ran"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
