<text x="56" y="260" font-size="16" font-weight="bold" fill="#444441">3. Transmission</text>
<text x="56" y="279" font-size="13.5" fill="#5F5E5A">Paused until stage 0 holds</text>
<rect x="40" y="304" width="300" height="52" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
<text x="56" y="326" font-size="16" font-weight="bold" fill="#444441">4. Persistence</text>
<text x="56" y="345" font-size="13.5" fill="#5F5E5A">Survives with models gone?</text>
<rect x="40" y="370" width="300" height="52" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
<text x="56" y="392" font-size="16" font-weight="bold" fill="#444441">5. A people's practice</text>
<text x="56" y="411" font-size="13.5" fill="#5F5E5A">Preparing becomes a tradition</text>
<rect x="40" y="436" width="300" height="52" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
<text x="56" y="458" font-size="16" font-weight="bold" fill="#444441">6. Scale</text>
<text x="56" y="477" font-size="13.5" fill="#5F5E5A">100 people against 30</text>
<rect x="40" y="502" width="300" height="52" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
<text x="56" y="524" font-size="16" font-weight="bold" fill="#444441">7. Accumulation</text>
<text x="56" y="543" font-size="13.5" fill="#5F5E5A">Tools build on tools</text>
<rect x="40" y="568" width="300" height="52" rx="4" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
<text x="56" y="590" font-size="16" font-weight="bold" fill="#444441">8. Society</text>
<text x="56" y="609" font-size="13.5" fill="#5F5E5A">Trade, roles, their own rules</text>
<rect x="425" y="170" width="200" height="52" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="441" y="192" font-size="16" font-weight="bold" fill="#2C2C2A">Safeguard fails</text>
<text x="441" y="211" font-size="13.5" fill="#5F5E5A">Fix code, rerun E13R</text>
<rect x="425" y="238" width="200" height="52" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="441" y="260" font-size="16" font-weight="bold" fill="#2C2C2A">No replication</text>
<text x="441" y="279" font-size="13.5" fill="#5F5E5A">Try another route</text>
