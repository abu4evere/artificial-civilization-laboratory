<text x="56" y="62" font-size="16" font-weight="bold" fill="#712B13">0. The world</text>
<text x="56" y="81" font-size="13.5" fill="#993C1D">v2 tested: no survival effect</text>
<rect x="40" y="106" width="300" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="56" y="128" font-size="16" font-weight="bold" fill="#085041">1. Culture appears</text>
<text x="56" y="147" font-size="13.5" fill="#0F6E56">Traditions and stories, E1–E5</text>
<rect x="40" y="172" width="300" height="52" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="56" y="194" font-size="16" font-weight="bold" fill="#085041">2. Why it stops</text>
<text x="56" y="213" font-size="13.5" fill="#0F6E56">Bottleneck mapped, E6–E13</text>
