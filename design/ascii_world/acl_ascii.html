<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACL in Text</title>
<style>
/* ACL drawn in text characters (a look, nothing more). The land, people, animals, fires, crops and weather are read from
   the running world through the viewer's own /terrain and /stream; the world is never touched.
   Each frame is drawn twice: once in colour, and once as a map of what each spot is (sea, grass, tree, rock, a person,
   a fire, an animal ...). Then every small cell of the screen becomes one character. Two styles (the council, 22 Nov):
   "reel" (default): brightness picks the character from one ramp, sharp changes of brightness become edge strokes
   | / - \, a fixed 4 x 4 dither breaks up bands, and the kind map only keeps small things (people) from being lost;
   "clear": each kind has its own characters (@ a person's head, % a tree, " grass, ~ the sea), with the same edges. The camera stays close and follows one person, as a game follows its character. Day and night are a
   slow clock for looks only: ACL's people live in weeks, not hours. */
:root{--bg:#020306;--ink:#c8d2df;--dim:#5d6a7e;--warm:#ffb45c;--line:#161f2c;--panel:rgba(4,6,10,.82)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font:13px/1.45 Consolas,"Cascadia Mono","DejaVu Sans Mono","Courier New",monospace}
canvas#view{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
canvas#view.drag{cursor:grabbing}
.hud{position:fixed;left:16px;top:12px;pointer-events:none;text-shadow:0 0 8px #000,0 0 2px #000;max-width:calc(100% - 32px)}
.hud .t{font-size:14px;letter-spacing:.08em}
.hud b{color:var(--warm);font-weight:normal}
.hud .s{color:var(--dim)}
.hud .who{margin-top:4px;color:var(--ink)}
.bar{position:fixed;right:16px;top:12px;display:flex;flex-direction:column;gap:5px;align-items:flex-end;opacity:.55;transition:opacity .2s}
.bar:hover{opacity:1}
.row{display:flex;gap:4px;align-items:center}
.row span{color:var(--dim);margin-right:4px;font-size:11px}
.bar button{background:var(--panel);color:var(--ink);border:1px solid var(--line);font:inherit;font-size:11px;padding:2px 7px;cursor:pointer}
.bar button:hover{border-color:#3a4a60}
.bar button.on{color:var(--warm);border-color:#6a4a22}
.key{position:fixed;left:16px;bottom:52px;background:var(--panel);border:1px solid var(--line);padding:7px 10px;font-size:12px;line-height:1.7;
  display:grid;grid-template-columns:repeat(4,auto);column-gap:14px;pointer-events:none}
.key[hidden]{display:none}
.key i{font-style:normal;font-weight:bold;display:inline-block;width:1.4em;text-align:center}
.news{position:fixed;left:16px;right:16px;bottom:12px;color:var(--dim);pointer-events:none;text-shadow:0 0 8px #000;font-size:12px}
.news div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.news div:last-child{color:#9aa6b6}
.tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line);padding:7px 10px;max-width:320px;display:none;font-size:12px}
.tip b{color:var(--warm);font-weight:normal;font-size:13px}
.tip .s{color:var(--dim)}
.msg{position:fixed;inset:0;display:grid;place-items:center;color:var(--dim);pointer-events:none}
@media (max-width:700px){.bar{top:auto;bottom:46px}.hud .s{display:none}.key{display:none}}
</style>
</head>
<body>
<canvas id="view" aria-label="The ACL world drawn in text characters"></canvas>
<div class="hud"><div class="t" id="title">A C L</div><div id="line1" class="s">waiting for the world…</div><div class="who" id="who"></div></div>
<div class="bar">
  <div class="row"><span>light</span><button data-light="auto">auto</button><button data-light="day">day</button><button data-light="dusk">dusk</button><button data-light="night" class="on">night</button></div>
  <div class="row"><span>style</span><button data-style="reel" class="on" title="Characters chosen by the picture and its edges, as in the reel">reel</button><button data-style="clear" title="Each kind of thing has its own characters (see the key)">clear</button></div>
  <div class="row"><span>text</span><button data-cell="s">small</button><button data-cell="m" class="on">medium</button><button data-cell="l">large</button><button id="plain">plain</button></div>
  <div class="row"><span>camera</span><button id="follow" class="on" title="Follow one person; click someone to follow them">follow</button><button id="near">close</button><button id="far">whole world</button><button id="keyBtn">key</button></div>
  <div class="row" id="speedRow"><span>weeks/s</span><button data-wps="0">pause</button><button data-wps="0.5">½</button><button data-wps="1">1</button><button data-wps="4">4</button></div>
</div>
<div class="key" id="key" hidden></div>
<div class="news" id="news"></div>
<div class="tip" id="tip"></div>
<div class="msg" id="msg"></div>
<script>
"use strict";
const $ = id => document.getElementById(id);

// ================= what things are (the viewer's own words and colours) =================
const BIOME = {deep:"#082640", sea:"#0d3a5c", lake:"#1a5a86", river:"#2b7fb3", beach:"#c9b37a", plains:"#7fa35a", forest:"#2f6b3a",
  woods:"#4a7f45", hills:"#7f8a5c", mountain:"#7d7a72", snow:"#e6edf2", desert:"#c7a466", tundra:"#93a08e"};
const WORDS = {rest:"resting", forage:"gathering plants", hunt:"hunting", fish:"fishing", gather:"picking something up", put:"setting something down",
  take:"fetching stored food", make:"making something", play:"playing", explore:"exploring", give:"giving food", care:"caring for someone",
  talk:"talking", court:"courting", steal:"stealing", attack:"attacking", flee:"fleeing", join:"going to someone", heat:"tending a fire", fill:"fetching water"};
const STAGE = ["baby", "child", "teen", "adult", "elder"];
const P = {id:0, name:1, x:2, y:3, fx:4, fy:5, sex:6, stage:7, doing:8, aim:9, line:10, carer:11, things:12, mood:13,
  sick:14, starving:15, grief:16, pregnant:17, health:18, partner:19, age:20, thought:21, state:22};
const BAND_COLS = ["#5fe08a", "#b083ff", "#ffb547", "#3fc8ff", "#ff7aa8", "#e8e36a", "#6ee7d8", "#ff9f5a"];
const SPECIES = ["", "rabbit", "deer", "bison", "bear", "fish"];
const ANIMAL = {rabbit:["#e0d2b4", 3], deer:["#c08850", 5.5], bison:["#8a5c3a", 7], bear:["#6a4a36", 7.5], fish:["#a8d0e4", 2.4]};

// ================= what each spot is, and the characters each kind is written with =================
// Each kind gets its own characters; brightness picks one of 8 from dark to bright. The sea and fresh water ripple.
const M = {sky:0, sea:1, fresh:2, sand:3, grass:4, floor:5, rock:6, snow:7, wall:8, leaf:9, trunk:10, head:11, body:12,
  fire:13, animal:14, crop:15, heap:16, store:17, rain:18};
const GLYPHS = [
  "   .:+*@",   // sky (stars, the moon)
  " .-~    ",   // sea: chosen by the ripple
  " .-=~   ",   // fresh water: rivers and lakes
  " .,,::;;",   // sand
  " .,,;;\"\"",  // grass
  " .,;;;\"\"",  // forest floor
  " .,:;=+n",   // rock: hills and mountains
  " .:-=+**",   // snow
  " .::;=||",   // the side of a block of land
  " .:+o%&8",   // leaves
  " .:!|III",   // tree trunk
  " .:oO0@@",   // a person's head
  " .:;!|IY",   // a person's body
  " .:*^^^^",   // fire
  "?rdbBf??",   // animals, by kind: rabbit deer bison bear fish
  " .vvvvww",   // crops
  " .:=+###",   // a heap of things
  " .:[$$$$",   // a store
  " .''////",   // rain
  " .:,;=+*xo#%&8@",   // the reel style: one ramp for everything, by brightness (sorted again by ink when the atlas is built)
  "|/-\\"];     // edges: vertical, rising, flat, falling
const RAMP = 19, EDGE = 20;
const KEY = [["@", "#ffd27a", "a person"], ["^", "#ffb050", "fire"], ["d", "#c08850", "deer"], ["r", "#e0d2b4", "rabbit"],
  ["b", "#a87048", "bison"], ["B", "#8a6a50", "bear"], ["&", "#5fb08a", "tree"], ["\"", "#8fbf62", "grass"],
  ["n", "#a4ac84", "hill, rock"], ["*", "#e6edf2", "snow"], ["~", "#5a8ac0", "sea"],
  ["=", "#4a9fd8", "river"], ["|", "#8a9a7a", "cliff side"], ["v", "#d8c46a", "crops"], ["#", "#b08a60", "heap"], ["$", "#b08a60", "store"]];
const mc = (id, part = 0) => `rgb(${id * 12},${part * 12},0)`;   // a kind, written as a colour on the second map

const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const rgb = (c, k = 1) => `rgb(${Math.min(255, c[0] * k) | 0},${Math.min(255, c[1] * k) | 0},${Math.min(255, c[2] * k) | 0})`;
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const hash = (a, b, c = 0) => ((Math.imul(a * 73856093 ^ b * 19349663 ^ c * 83492791, 2654435761) >>> 0) % 100000) / 100000;
const wrapD = (d, n) => { d = ((d % n) + n) % n; return d > n / 2 ? d - n : d; };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;"}[c]));

// paint one shape on both maps: in colour, and as its kind (both maps share the camera's transform: world px)
function both(g, m, col, id, part, path){ g.fillStyle = col; g.beginPath(); path(g); g.fill(); m.fillStyle = mc(id, part); m.beginPath(); path(m); m.fill(); }
function rectBoth(g, m, col, id, part, x, y, w, h){ g.fillStyle = col; g.fillRect(x, y, w, h); m.fillStyle = mc(id, part); m.fillRect(x, y, w, h); }
const circle = (x, y, r) => q => q.arc(x, y, r, 0, 7);
function shadow(g, x, y, rx, ry, a = .35){ g.fillStyle = `rgba(0,0,0,${a})`; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, 7); g.fill(); }

// ================= state =================
let terrain = null, W = 40, H = 40, frame = null, frameAt = 0, interval = 1000, season = "";
let RX = 0, RY = 0;                                      // the world wraps; the seam is put where the sea is widest
const TW = 64, TH = 32, SEA = -0.2, STEP = 0.035, LV = 3.2;   // iso tile size, terrace step (height units) and its height in px
let OX = 0, OY = 0, WWID = 0, WHGT = 0, levels = [], kinds = [];
const cam = {x: 0, y: 0, z: 1, touched: false};
const view = {light: "night", cell: "m", plain: false, follow: null, style: "reel"};
const COLUMNS = {s: 190, m: 150, l: 115};   // characters across the screen (the reel shows about 140)
const news = [];
let picks = [];

// ================= the land's shape (heights, kinds); drawn fresh each frame so it is sharp at any distance =================
const HZ = .13;   // the horizon, as a share of the screen's height: open sea below it, sky and moon above
function disp(x, y){ return [((x - RX) % W + W) % W, ((y - RY) % H + H) % H]; }
function iso(dx, dy){ return [(dx - dy) * TW / 2 + OX, (dx + dy) * TH / 2 + OY]; }
function tileAt(x, y){ return terrain.tiles[(((y % H) + H) % H) * W + (((x % W) + W) % W)]; }
function chooseSeam(){
  const landIn = (f) => { let best = 0, bi = 0; for (let k = 0; k < f.n; k++){ let water = 0;
      for (let j = 0; j < f.m; j++) water += f.at(k, j)[5] ? 1 : 0; if (water > best){ best = water; bi = k; } } return bi; };
  RX = landIn({n: W, m: H, at: (k, j) => tileAt(k, j)});
  RY = landIn({n: H, m: W, at: (k, j) => tileAt(j, k)});
}
const KIND_OF = {beach: M.sand, desert: M.sand, plains: M.grass, tundra: M.grass, forest: M.floor, woods: M.floor,
  hills: M.rock, mountain: M.rock, snow: M.snow, river: M.fresh, lake: M.fresh};
function prepLand(){
  levels = new Array(W * H); kinds = new Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
    const t = tileAt(x, y), i = y * W + x;
    kinds[i] = t[5] ? "water" : t[6];
    levels[i] = t[5] ? 0 : Math.max(1, Math.round((t[7] - SEA) / STEP));
  }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){     // rivers sit a step below their banks
    const i = y * W + x; if (kinds[i] === "river") levels[i] = Math.max(1, levels[i] - 1);
  }
  OX = H * TW / 2 + TW; OY = Math.max(...levels) * LV + TH * 2;
  WWID = (W + H) * TW / 2 + TW * 2; WHGT = (W + H) * TH / 2 + OY + TH * 2;
}
const lvD = (dx, dy) => { if (dx < 0 || dy < 0 || dx >= W || dy >= H) return 0; const [x, y] = [(dx + RX) % W, (dy + RY) % H]; return levels[y * W + x]; };
const kdD = (dx, dy) => { const [x, y] = [(dx + RX) % W, (dy + RY) % H]; return kinds[y * W + x]; };
const diamond = (sx, sy, grow = 0) => c => { c.moveTo(sx, sy - grow); c.lineTo(sx + TW / 2 + grow, sy + TH / 2); c.lineTo(sx, sy + TH + grow); c.lineTo(sx - TW / 2 - grow, sy + TH / 2); c.closePath(); };

function drawTree(g, m, tx, ty, sz, leaf, winter, seed){
  const th = 15 * sz, cr = 10.5 * sz, cy = ty - th - cr * .55;
  shadow(g, tx + 3 * sz, ty, cr * .95, cr * .42, .4);
  both(g, m, "#3a2a1e", M.trunk, 0, q => { q.moveTo(tx - 2.4 * sz, ty); q.lineTo(tx - 1.4 * sz, ty - th); q.lineTo(tx + 1.4 * sz, ty - th); q.lineTo(tx + 2.4 * sz, ty); q.closePath(); });
  g.fillStyle = "#5a4430"; g.fillRect(tx - 1.6 * sz, ty - th, 1.1 * sz, th);   // light on the trunk's left
  const blobs = [[0, 0, 1], [-.62, .32, .74], [.64, .3, .72], [-.3, -.62, .72], [.34, -.55, .66], [0, -1.05, .55]];
  for (const [bx, by, br] of blobs) both(g, m, rgb(leaf, .5), M.leaf, 0, circle(tx + bx * cr, cy + by * cr, br * cr));
  for (const [bx, by, br] of blobs){ const j = hash(seed, bx * 10 | 0, by * 10 | 0) * .25;
    g.fillStyle = rgb(leaf, .82 + j); g.beginPath(); g.arc(tx + bx * cr - br * cr * .2, cy + by * cr - br * cr * .22, br * cr * .68, 0, 7); g.fill(); }
  for (const [bx, by, br] of blobs.slice(3)){ g.fillStyle = rgb(leaf, 1.22); g.beginPath(); g.arc(tx + bx * cr - br * cr * .35, cy + by * cr - br * cr * .38, br * cr * .32, 0, 7); g.fill(); }
  for (let n = 0; n < 10; n++){ const a = hash(seed, n, 7) * 6.28, r = Math.sqrt(hash(seed, n, 9)) * cr;   // single leaves
    g.fillStyle = rgb(leaf, hash(seed, n, 3) < .5 ? .55 : 1.3); g.fillRect(tx + Math.cos(a) * r, cy + Math.sin(a) * r * .9 - cr * .2, 1.4, 1.4); }
  if (winter) both(g, m, "#dfe8f0", M.snow, 0, q => q.ellipse(tx - cr * .15, cy - cr * .9, cr * .55, cr * .22, 0, 0, 7));
}

function drawLand(g, m, r, now){
  const winter = season === "winter", autumn = season === "autumn", z = cam.z;
  const vis = (sx, top, bot) => sx + TW / 2 + 40 >= r.x0 && sx - TW / 2 - 40 <= r.x1 && bot >= r.y0 && top <= r.y1;
  // the world's own sea: lighter in the shallows (its kind is the open sea's, painted under everything)
  for (let dy = 0; dy < H; dy++) for (let dx = 0; dx < W; dx++){
    if (kdD(dx, dy) !== "water") continue;
    const [sx, sy] = iso(dx, dy); if (!vis(sx, sy, sy + TH)) continue;
    const t = tileAt(dx + RX, dy + RY), deep = t[6] === "deep" || t[7] < -0.21, c = hexRgb(BIOME[t[6]] || BIOME.sea);
    g.fillStyle = rgb(c, deep ? .8 : 1 + Math.max(0, t[7] + .2) * 4); g.beginPath(); diamond(sx, sy, .6)(g); g.fill();
  }
  // then the land, back to front, as terraced blocks
  const specks = Math.round(Math.min(46, 10 + 7 * z));
  for (let s = 0; s < W + H - 1; s++) for (let dx = Math.max(0, s - H + 1); dx <= Math.min(W - 1, s); dx++){
    const dy = s - dx; if (kdD(dx, dy) === "water") continue;
    const k = kdD(dx, dy), L = lvD(dx, dy), e = L * LV, kind = KIND_OF[k] ?? M.grass;
    const [sx, sy0] = iso(dx, dy), sy = sy0 - e;
    if (!vis(sx, sy - 70, sy0 + TH)) continue;
    let c = hexRgb(BIOME[k] || BIOME.plains), topKind = kind;
    if (winter && k !== "river" && k !== "lake"){ c = mix(c, [214, 222, 232], k === "beach" || k === "desert" ? .25 : .62); if (k !== "beach" && k !== "desert") topKind = M.snow; }
    const back = lvD(dx - 1, dy) + lvD(dx, dy - 1);   // light from the north-west: lit when higher than the blocks behind
    const top = c.map(v => v * Math.max(.7, Math.min(1.25, 1 + (2 * L - back) * .05)));
    const lowL = lvD(dx, dy + 1), lowR = lvD(dx + 1, dy);   // the sides show only down to the next block in front
    if (L > lowL) both(g, m, rgb(c, .55), M.wall, 1, q => { q.moveTo(sx - TW / 2, sy + TH / 2); q.lineTo(sx, sy + TH); q.lineTo(sx, sy0 + TH - lowL * LV); q.lineTo(sx - TW / 2, sy0 + TH / 2 - lowL * LV); q.closePath(); });
    if (L > lowR) both(g, m, rgb(c, .36), M.wall, 2, q => { q.moveTo(sx + TW / 2, sy + TH / 2); q.lineTo(sx, sy + TH); q.lineTo(sx, sy0 + TH - lowR * LV); q.lineTo(sx + TW / 2, sy0 + TH / 2 - lowR * LV); q.closePath(); });
    both(g, m, rgb(top), topKind, 0, diamond(sx, sy, .4));
    // a bright rim where a block stands above the ones behind it, a dark one at its front edge
    g.lineWidth = .9;
    if (L > lvD(dx - 1, dy)){ g.strokeStyle = rgb(top, 1.45); g.beginPath(); g.moveTo(sx - TW / 2, sy + TH / 2); g.lineTo(sx, sy); g.stroke(); }
    if (L > lvD(dx, dy - 1)){ g.strokeStyle = rgb(top, 1.3); g.beginPath(); g.moveTo(sx, sy); g.lineTo(sx + TW / 2, sy + TH / 2); g.stroke(); }
    if (L > lowL || L > lowR){ g.strokeStyle = rgb(top, .45); g.beginPath(); g.moveTo(sx - TW / 2, sy + TH / 2); g.lineTo(sx, sy + TH); g.lineTo(sx + TW / 2, sy + TH / 2); g.stroke(); }
    // ground texture: specks of lighter and darker ground, and tufts on grass
    const n0 = k === "snow" ? specks >> 2 : k === "river" ? 0 : specks;
    for (let n = 0; n < n0; n++){
      const u = hash(dx, dy, n) - .5, v = hash(dy, dx, n + 99) - .5, px = sx + (u - v) * TW / 2 * .92, py = sy + TH / 2 + (u + v) * TH / 2 * .92;
      const lighter = hash(dx + n, dy, 7) < .5;
      g.fillStyle = rgb(top, lighter ? 1.3 : .68);
      if ((kind === M.grass || kind === M.floor) && !winter && n % 3 === 0){ g.fillRect(px, py - 2.2, .8, 2.4); g.fillRect(px + 1.1, py - 1.6, .8, 1.8); }
      else g.fillRect(px, py, 1.3, .9);
    }
    if (k === "river"){ g.strokeStyle = rgb(c, 1.6); g.lineWidth = .8;
      for (let n = 0; n < 4; n++){ const o = (n - 1.5) * 5, f = (now / 900 + n * .37) % 1; g.beginPath(); g.moveTo(sx - 16 + o + f * 6, sy + TH / 2 - 4 + o * .2 + f * 3); g.lineTo(sx - 4 + o + f * 6, sy + TH / 2 + 2 + o * .2 + f * 3); g.stroke(); } }
    if (k === "mountain" || k === "snow")   // a rock crown
      both(g, m, rgb(c, k === "snow" ? 1.08 : 1.25), k === "snow" ? M.snow : M.rock, 0, q => { q.moveTo(sx - 13, sy + TH / 2 + 2); q.lineTo(sx - 2, sy + TH / 2 - 17 - hash(dx, dy, 3) * 10); q.lineTo(sx + 10, sy + TH / 2 + 3); q.closePath(); });
    // trees: forest and woods, placed by a fixed hash so they never jump
    const nTrees = k === "forest" ? 3 : k === "woods" ? 2 : (k === "plains" && hash(dx, dy, 5) < .12) ? 1 : 0;
    const trees = [];
    for (let n = 0; n < nTrees; n++){ const u = hash(dx, dy, 11 + n) - .5, v = hash(dy, dx, 31 + n) - .5;
      trees.push([sx + (u - v) * TW / 2 * .7, sy + TH / 2 + (u + v) * TH / 2 * .7, .85 + hash(dx, dy, 51 + n) * .45, dx * 97 + dy * 13 + n]); }
    trees.sort((a, b) => a[1] - b[1]);
    const leaf = autumn ? [196, 116, 48] : winter ? [72, 104, 96] : k === "forest" ? [52, 148, 128] : [80, 156, 104];
    for (const [tx, ty, sz, sd] of trees) drawTree(g, m, tx, ty, sz, leaf, winter, sd);
  }
}

// ================= where things are on screen =================
let SW = 0, SH = 0, CW = 0, CH = 0, DPR = 1, S = 1, SS = .5;   // scene size, css size, scene px per world px
function lvAt(x, y){ const [dx, dy] = disp(Math.round(x), Math.round(y)); return lvD(dx, dy) || 0; }
function worldPx(x, y){   // a fractional tile position (centre at +.5) -> world px, standing on the block
  const [dx, dy] = disp(x, y); const fx = x - Math.floor(x), fy = y - Math.floor(y);
  const [sx, sy] = iso(dx + fx, dy + fy); return [sx, sy - lvAt(x, y) * LV];
}
function toScene(wx, wy){ return [(wx - cam.x) * S + SW / 2, (wy - cam.y) * S + SH / 2]; }
function fitCamera(){   // the whole world
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){ if (tileAt(x, y)[5]) continue;
    const [px, py] = worldPx(x + .5, y + .5); x0 = Math.min(x0, px); x1 = Math.max(x1, px); y0 = Math.min(y0, py - 40); y1 = Math.max(y1, py); }
  if (x0 > x1){ x0 = 0; x1 = WWID; y0 = 0; y1 = WHGT; }

  if (id >= HEAD && id <= ANIMAL) col = col * 1.25 + .08;   // the living and fire stand out
  if (uRain > 0. && id < HEAD){   // rain falls through the cells
    float drop = h(vec2(cell.x, floor(cell.y / 3. - uTime * 7. + h(vec2(cell.x, 9.)) * 50.)));
    if (drop < .05 * uRain){ gi = glyph(RAIN, 7.); col = vec3(.55, .65, .8) * (.6 + .5 * (1. - uDark * .4)); }
  }
  float mask = texture(uAtlas, vec2((gi + f.x) / uNAll, f.y)).r;
  vec3 haze = texture(uLight, cuv).rgb * vec3(1., .62, .32) * .2;   // a glow behind the characters, only near fires
  o = vec4((col * mask + haze) * vig, 1.);   // otherwise pure black between the characters
}`;
function setupGL(){
  if (!gl){ $("msg").textContent = "This browser has no WebGL2; showing the plain picture."; return false; }
  const sh = (t, s) => { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x);
    if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; };
  prog = gl.createProgram(); gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const tex = (unit, filter) => { const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); return t; };
  texScene = tex(0, gl.LINEAR); texKind = tex(1, gl.NEAREST); texLight = tex(2, gl.LINEAR); texAtlas = tex(3, gl.NEAREST); texTab = tex(4, gl.NEAREST);
  for (const n of ["uScene", "uKind", "uLight", "uAtlas", "uTab", "uRes", "uCell", "uOff", "uTime", "uDark", "uAscii", "uNAll", "uSeed", "uAmb", "uTop", "uBot", "uMoon", "uHz", "uRain", "uStyle", "uNRamp"])
    U[n] = gl.getUniformLocation(prog, n);
  gl.uniform1i(U.uScene, 0); gl.uniform1i(U.uKind, 1); gl.uniform1i(U.uLight, 2); gl.uniform1i(U.uAtlas, 3); gl.uniform1i(U.uTab, 4);
  return true;
}
let atlasFor = "";
function resize(){
  DPR = Math.min(2, devicePixelRatio || 1); CW = innerWidth; CH = innerHeight;
  cv.width = Math.round(CW * DPR); cv.height = Math.round(CH * DPR);
  SW = Math.round(cv.width * SS); SH = Math.round(cv.height * SS);
  scene.width = kindC.width = SW; scene.height = kindC.height = SH;
  lightC.width = Math.max(8, Math.round(SW / 4)); lightC.height = Math.max(8, Math.round(SH / 4));
  if (terrain && !cam.touched && !view.follow) closeUp();
}
addEventListener("resize", resize);

// ================= the loop =================
let glOK = false, glLost = false;
function upload(unit, t, src){ gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src); }
function followCamera(){   // the camera glides after the person it follows
  if (!view.follow || !frame) return;
  const p = picks.find(q => q[2][P.id] === view.follow);
  if (!p){ const b = busiest(); view.follow = b ? b[P.id] : null; return; }   // they died or left: follow someone else
  const tx = p[3], ty = p[4] - 14 - CH * HZ / 2 / cam.z;
  cam.x += (tx - cam.x) * .06; cam.y += (ty - cam.y) * .06;
}
function draw(now){
  requestAnimationFrame(draw);
  if (!terrain || glLost) return;
  followCamera();
  S = cam.z * DPR * SS;
  const L = lightNow(now);
  drawScene(now, L);
  if (!glOK){ if (!gl){ const g2 = cv.getContext("2d"); if (g2) g2.drawImage(scene, 0, 0, cv.width, cv.height); } return; }
  const cw = Math.max(5, Math.round(cv.width / COLUMNS[view.cell])), ch = Math.round(cw * 1.5), key = cw + "x" + ch;
  if (key !== atlasFor){ buildAtlas(cw, ch); atlasFor = key; }
  gl.viewport(0, 0, cv.width, cv.height);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 4);
  upload(0, texScene, scene); upload(1, texKind, kindC); upload(2, texLight, lightC);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, texAtlas);
  gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D, texTab);
  const sky = (frame && frame.sky) || {};
  gl.uniform2f(U.uRes, cv.width, cv.height); gl.uniform2f(U.uCell, cw, ch); gl.uniform1f(U.uTime, now / 1000);
  gl.uniform1f(U.uDark, L.dark); gl.uniform1f(U.uAscii, view.plain ? 0 : 1); gl.uniform1f(U.uNAll, NALL);
  gl.uniform1f(U.uSeed, (terrain.seed || 0) % 97); gl.uniform3fv(U.uAmb, L.amb); gl.uniform3fv(U.uTop, L.top); gl.uniform3fv(U.uBot, L.bot);
  gl.uniform2f(U.uMoon, .7, HZ * .5); gl.uniform1f(U.uHz, HZ);
  gl.uniform1f(U.uRain, sky.storm ? 2.5 : sky.rain > 0 ? Math.min(2, .8 + sky.rain) : 0);
  gl.uniform1f(U.uStyle, view.style === "reel" ? 1 : 0); gl.uniform1f(U.uNRamp, NRAMP);
  gl.uniform2f(U.uOff, Math.floor(cam.x * cam.z * DPR / cw), Math.floor(cam.y * cam.z * DPR / ch));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

// ================= words on the screen =================
$("key").innerHTML = KEY.map(([g, c, w]) => `<div><i style="color:${c}">${esc(g)}</i>${esc(w)}</div>`).join("");
function personLine(r){
  const what = (r[P.doing] || "").split(" ")[0];
  return `<b>${esc(r[P.name])}</b> <span class="s">${STAGE[r[P.stage]] || ""}, ${r[P.age]} years</span> · ${esc(WORDS[what] || r[P.doing] || "")}`;
}
function hud(){
  if (!frame) return;
  $("title").innerHTML = `A C L <span class="s">·</span> <b>year ${frame.year}</b>, week ${frame.week + 1}, ${esc(frame.season)}`;
  const sk = frame.sky || {}, w = sk.storm ? " · a storm" : sk.flood ? " · flooding" : sk.rain > 0 ? " · rain" : "";
  $("line1").innerHTML = `${frame.pop} people · ${frame.gen} generations · ${(frame.bands || []).length} bands${w}`;
  const f = view.follow && (frame.people || []).find(r => r[P.id] === view.follow);
  $("who").innerHTML = f ? `following ${personLine(f)}` : "";
  for (const n of frame.news || []) news.push(typeof n === "string" ? n : `year ${n.year}: ${n.text}`);
  news.splice(0, Math.max(0, news.length - 2));
  $("news").innerHTML = news.map(n => `<div>${esc(n)}</div>`).join("");
  const wps = frame.wps; document.querySelectorAll("[data-wps]").forEach(b => b.classList.toggle("on", Number(b.dataset.wps) === wps));
}
function nearest(e, within = 24){ let best = null, bd = within; for (const p of picks){ const d = Math.hypot(p[0] - e.clientX, p[1] - e.clientY); if (d < bd){ bd = d; best = p; } } return best; }
cv.addEventListener("mousemove", e => {
  if (drag) return; const p = nearest(e), tip = $("tip");
  if (!p){ tip.style.display = "none"; return; }
  tip.innerHTML = personLine(p[2]) + (p[2][P.thought] ? `<br><span class="s">${esc(p[2][P.thought])}</span>` : "") + `<br><span class="s">click to follow</span>`;
  tip.style.display = "block"; tip.style.left = Math.min(innerWidth - 330, e.clientX + 14) + "px"; tip.style.top = (e.clientY + 14) + "px";
});

// ================= moving around =================
let drag = null, moved = false;
function setFollow(id){ view.follow = id; $("follow").classList.toggle("on", !!id); hud(); }
cv.addEventListener("pointerdown", e => { drag = [e.clientX, e.clientY, cam.x, cam.y]; moved = false; cv.classList.add("drag"); cv.setPointerCapture(e.pointerId); $("tip").style.display = "none"; });
cv.addEventListener("pointermove", e => { if (!drag) return; if (Math.hypot(e.clientX - drag[0], e.clientY - drag[1]) > 4){ moved = true; if (view.follow) setFollow(null); }
  if (moved){ cam.x = drag[2] - (e.clientX - drag[0]) / cam.z; cam.y = drag[3] - (e.clientY - drag[1]) / cam.z; cam.touched = true; } });
cv.addEventListener("pointerup", e => { if (drag && !moved){ const p = nearest(e, 30); if (p){ setFollow(p[2][P.id]); if (cam.z < 2.5) closeZoom(); } } drag = null; cv.classList.remove("drag"); });
cv.addEventListener("wheel", e => { e.preventDefault(); const f = Math.exp(-e.deltaY * .0012), mx = (e.clientX - CW / 2) / cam.z, my = (e.clientY - CH / 2) / cam.z;
  const z = Math.max(.25, Math.min(12, cam.z * f)); if (!view.follow){ cam.x += mx - mx * cam.z / z; cam.y += my - my * cam.z / z; } cam.z = z; cam.touched = true; }, {passive: false});
addEventListener("keydown", e => {
  const step = 60 / cam.z;
  if (e.key === "+" || e.key === "=") cam.z = Math.min(12, cam.z * 1.2); else if (e.key === "-") cam.z = Math.max(.25, cam.z / 1.2);
  else if (e.key.startsWith("Arrow")){ setFollow(null); cam.x += e.key === "ArrowLeft" ? -step : e.key === "ArrowRight" ? step : 0; cam.y += e.key === "ArrowUp" ? -step : e.key === "ArrowDown" ? step : 0; }
  else if (e.key === "0"){ setFollow(null); fitCamera(); } else return;
  cam.touched = true;
});
document.querySelectorAll("[data-light]").forEach(b => b.onclick = () => { view.light = b.dataset.light; document.querySelectorAll("[data-light]").forEach(x => x.classList.toggle("on", x === b)); });
document.querySelectorAll("[data-cell]").forEach(b => b.onclick = () => { view.cell = b.dataset.cell; document.querySelectorAll("[data-cell]").forEach(x => x.classList.toggle("on", x === b)); });
$("plain").onclick = () => { view.plain = !view.plain; $("plain").classList.toggle("on", view.plain); };
document.querySelectorAll("[data-style]").forEach(b => b.onclick = () => { view.style = b.dataset.style; document.querySelectorAll("[data-style]").forEach(x => x.classList.toggle("on", x === b)); });
$("follow").onclick = () => { if (view.follow) setFollow(null); else { const b = busiest(); if (b){ setFollow(b[P.id]); closeZoom(); } } };
$("near").onclick = () => { setFollow(null); closeUp(); cam.touched = true; };
$("far").onclick = () => { setFollow(null); fitCamera(); cam.touched = true; };
$("keyBtn").onclick = () => { const k = $("key"); k.hidden = !k.hidden; $("keyBtn").classList.toggle("on", !k.hidden); };
document.querySelectorAll("[data-wps]").forEach(b => b.onclick = () => fetch("/speed?wps=" + b.dataset.wps).catch(() => {}));

// ================= the world =================
function startGL(){ try { glOK = setupGL(); atlasFor = ""; $("msg").textContent = ""; } catch (err) { glOK = false; $("msg").textContent = "The text pass failed: " + err.message; } }
// the browser may take the graphics context back when the computer is busy; wait, then build it again
cv.addEventListener("webglcontextlost", e => { e.preventDefault(); glLost = true; $("msg").textContent = "graphics paused by the browser; resuming…"; });
cv.addEventListener("webglcontextrestored", () => { glLost = false; startGL(); });
startGL();
resize();
fetch("/terrain").then(r => r.json()).then(t => {
  terrain = t; W = t.width; H = t.height; chooseSeam(); prepLand(); fitCamera();
  $("speedRow").style.display = t.live ? "none" : "";
  let first = true;
  const es = new EventSource("/stream");
  es.onmessage = e => {
    const f = JSON.parse(e.data); const changed = !frame || f.t !== frame.t;
    if (changed){ interval = frameAt ? Math.min(4000, performance.now() - frameAt) : 1000; frameAt = performance.now(); }
    frame = f; season = f.season;
    if (first){ first = false; const b = busiest(); if (b){ closeZoom(); const [wx, wy] = worldPx(b[P.x] + .5, b[P.y] + .5); cam.x = wx; cam.y = wy - 14 - CH * HZ / 2 / cam.z; setFollow(b[P.id]); } }
    hud();
  };
}).catch(() => { $("msg").textContent = "No world here. Start one with: python design/ascii_world/ascii_watch.py"; });
requestAnimationFrame(draw);
</script>
</body>
</html>
