<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Their world</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* A cozy game look for the side panel; the map itself is pixel art. */
:root{--wood:#3dd68c;--wood-2:#2a9d68;--paper:#0d1218;--paper-2:#161d26;--ink:#eaf0f6;--ink-2:#a7b3c0;
 --muted:#6d7a88;--accent:#3dd68c;--gold:#e5b347;--line:#263241;--bg-3:#1f2936}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:#0b0f15;color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
.pix{font-family:"Pixelify Sans","Courier New",monospace}
.app{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:100vh}
.stage{position:relative;min-width:0;overflow:hidden;background:#0b0f15}
canvas#map{display:block;width:100%;height:100%;cursor:grab;touch-action:none;image-rendering:pixelated}
canvas#map.dragging{cursor:grabbing}
.panel{background:linear-gradient(180deg,var(--paper),#121923);border-left:1px solid var(--line);overflow-y:auto;padding:20px 18px 40px}
h1{font:700 24px/1.1 "Pixelify Sans","Courier New",monospace;margin:0;color:var(--wood)}
h2{font:600 15px "Pixelify Sans","Courier New",monospace;color:var(--wood);margin:20px 0 8px;letter-spacing:.02em}
.date{color:var(--ink-2);margin-top:4px;font-variant-numeric:tabular-nums}
.clock{color:var(--muted);font-size:12px;margin-top:2px;font-variant-numeric:tabular-nums}
.hint a{color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--paper-2);border:1px solid var(--line);border-radius:10px;padding:10px 11px}
.stat .l{font-size:12px;color:var(--ink-2)}
.stat .v{font:700 22px "Pixelify Sans","Courier New",monospace;color:var(--wood)}
.speed{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;align-items:center}
.speed span{color:var(--ink-2);font-size:12px;margin-right:2px}
.speed button,.cam button{border:2px solid var(--wood);background:var(--paper);color:var(--wood);border-radius:6px;
 padding:3px 10px;font:600 14px "Pixelify Sans","Courier New",monospace;cursor:pointer}
.speed button.on{background:var(--wood);color:var(--paper)}
.cam{position:absolute;right:12px;bottom:12px;display:flex;gap:6px;z-index:2}
.cam button{box-shadow:0 3px 0 var(--wood);min-width:36px}
.cam button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood)}
.news{display:flex;flex-direction:column;gap:6px}
.news p{margin:0;padding:6px 8px;border-radius:6px;background:var(--paper-2)}
.news p .y{color:var(--muted);font-size:12px;margin-right:6px;font-variant-numeric:tabular-nums}
.news p.big{border-left:4px solid var(--gold)}
.tip{position:absolute;pointer-events:none;background:var(--paper);color:var(--ink);border:3px solid var(--wood);
 border-radius:6px;padding:6px 10px;font-size:13px;box-shadow:0 4px 0 rgba(0,0,0,.3);display:none;max-width:280px;z-index:3}
.tip .t{font:600 15px "Pixelify Sans","Courier New",monospace;color:var(--wood)}
.tip .s{color:var(--ink-2);font-size:12px}
.banner{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:var(--paper);color:var(--ink);
 border:3px solid var(--wood);border-radius:8px;padding:10px 14px;max-width:min(560px,70%);
 box-shadow:0 5px 0 rgba(0,0,0,.35);opacity:0;transition:opacity .4s;pointer-events:none;z-index:2;
 font:600 15px "Pixelify Sans","Courier New",monospace}
.banner.show{opacity:1}
.help{position:absolute;left:12px;bottom:12px;color:#d5dee8;background:rgba(13,18,24,.78);border:1px solid var(--line);border-radius:8px;padding:6px 11px;
 font:14px "Pixelify Sans","Courier New",monospace;pointer-events:none;transition:opacity 1s;z-index:2}
.person{background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px}
.person h3{margin:0;font:700 19px "Pixelify Sans","Courier New",monospace;color:var(--wood)}
.person .sub{color:var(--ink-2);font-size:12px;margin-bottom:6px}
.person ul{margin:4px 0 0;padding-left:18px}
.person li{margin:2px 0}
.person .k{color:var(--muted);font-size:12px;margin-top:8px;font-weight:600}
.person button{float:right;border:0;background:none;color:var(--ink-2);cursor:pointer;font-size:18px}
.hint{color:var(--muted);font-size:12px;margin-top:10px}
.see{margin:0;padding-left:18px;color:var(--ink-2);font-size:13px}
.see li{margin:2px 0}
.mini{position:absolute;top:12px;right:12px;width:176px;height:176px;border-radius:6px;image-rendering:pixelated;
 box-shadow:0 4px 0 rgba(0,0,0,.4);border:4px solid var(--wood);cursor:pointer;z-index:2}
.talk{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto}
.talk .line{padding:6px 9px;border-radius:6px;background:var(--paper-2);border:2px solid transparent;cursor:pointer}
.talk .line:hover{border-color:var(--wood-2)}
.talk .when{color:var(--muted);font-size:11px}
.talk .who{font:600 14px "Pixelify Sans","Courier New",monospace;color:var(--wood)}
.talk .said{display:block}
.talk .line.say .said{font-weight:600}
.talk .line.chat .said{color:var(--ink-2)}
.talk .empty,.people .empty{color:var(--muted);font-size:13px}
.find{width:100%;padding:6px 9px;border-radius:6px;border:2px solid #d9c49a;background:#fffaf0;color:var(--ink);font:inherit;margin-bottom:6px}
.people{display:flex;flex-direction:column;gap:2px;max-height:300px;overflow-y:auto}
.people button{display:flex;align-items:center;gap:8px;text-align:left;border:0;background:none;color:var(--ink);
 font:inherit;padding:4px 6px;border-radius:6px;cursor:pointer}
.people button:hover{background:var(--paper-2)}
.people .dot{width:11px;height:11px;border-radius:2px;flex:none;border:2px solid #2b1d14}
.people .what{color:var(--muted);font-size:12px;margin-left:auto;white-space:nowrap}
@media (max-width:800px){.app{grid-template-columns:1fr;grid-template-rows:65vh auto;height:auto}
 body{overflow:auto}.panel{border-left:0;border-top:6px solid var(--wood)}}
</style>
</head>
<body>
<main class="app">
  <section class="stage" id="stage">
    <canvas id="map" aria-label="Their world, seen from above"></canvas>
    <canvas id="mini" class="mini" aria-label="Where everyone is; click to look there"></canvas>
    <div class="tip" id="tip"></div>
    <div class="banner" id="banner"></div>
    <div class="help" id="help">Scroll to zoom in · drag to look around · click someone, or a name on the right, to follow them</div>
    <div class="cam">
      <button id="zin" title="Closer">+</button><button id="zout" title="Further">−</button>
      <button id="zall" title="The whole world">World</button>
    </div>
  </section>
  <aside class="panel">
    <div class="head">
      <h1 id="title">Their world</h1>
      <div class="date" id="date">connecting…</div>
      <div class="clock" id="clock" hidden></div>
    </div>
    <div class="stats">
      <div class="stat"><div class="l">People</div><div class="v" id="pop">–</div></div>
      <div class="stat"><div class="l">Generation</div><div class="v" id="gen">–</div></div>
      <div class="stat"><div class="l">Weather</div><div class="v" id="wx">–</div></div>
    </div>
    <div class="speed" id="speed"><span>Weeks per second</span></div>
    <div id="person"></div>
    <h2>What has happened</h2>
    <div class="news" id="news"></div>
    <p class="hint">Click a person to follow their life · <a href="/chronicle" target="_blank" rel="noopener">the whole chronicle</a></p>
  </aside>
</main>
<script>
"use strict";
// =============================================================================================
// Palette and constants. The map is pixel art: everything is drawn as whole pixels on a small
// canvas (48 pixels to a tile) and scaled up without smoothing.
// =============================================================================================
const TAU = Math.PI * 2;
const TP = 48;                                          // art pixels per tile
const OUT = "#2b1d14";                                  // the dark outline around everything
const SKIN = ["#f6c9a0", "#e8b28a", "#c98e64", "#9a6644", "#704a31", "#f2d2b6"];
const HAIR = ["#3a2618", "#5c3a22", "#7b4e2a", "#241a14", "#a86b32", "#c48a42"];
const LINE = ["#3d7fd4", "#e0673a", "#36a86e", "#e9b13b", "#d86b9e", "#7a5bc9"];
const PANTS = ["#6b4f3a", "#5a4632", "#7a5a40"];
const GRASS = {   // poor ground -> rich ground
  spring: ["#cdb978", "#a8b862", "#82b14c", "#62a03e", "#4b8a34"],
  summer: ["#c6ad6a", "#a3a852", "#7da445", "#5d9339", "#477e30"],
  autumn: ["#cfa463", "#bb9a52", "#a09346", "#86833c", "#6d7134"],
  winter: ["#f3f6f8", "#e7ecf0", "#dbe2e8", "#cfd8df", "#c3cdd6"],
};
const STONE = ["#a9a49a", "#8f8a80", "#77726a"];
const DIRT = ["#b48d5e", "#9d7a50", "#866744"];
const SAND = ["#d3b06a", "#c6a05a", "#b8924e"].map(hexRgb);
const SNOWY = ["#eef2f6", "#dfe6ec"].map(hexRgb);
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const SIGN = {rest: "💤", forage: "🌿", hunt: "🏹", fish: "🎣", gather: "✋", put: "📥", take: "📤", make: "🔨", play: "✨",
  explore: "👣", give: "🎁", care: "🤲", talk: "💬", court: "💗", steal: "🤫", attack: "⚔️", flee: "💨", join: "🚶"};

// =============================================================================================
// State
// =============================================================================================
const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");
const tip = document.getElementById("tip");
const banner = document.getElementById("banner");
let terrain = null, W = 20, H = 20, feats = [];
let frame = null, frameAt = 0, interval = 250, liveMode = false, clock = null, clockOffset = 0;
let rows = new Map(), says = [], moments = [], hunts = [], talks = [], evening = [], animals = [];
let heard = [], heardKeys = new Set();   // every line that has appeared on screen this week
const bodies = new Map();
const cam = {x: 0, y: 0, z: 30, fit: 30, follow: null, vw: 0, vh: 0};
let particles = [], graves = [], weather = [], gifts = [];
let selected = null, selectedTimer = null, hover = null, lastT = performance.now(), lastPlan = null;
const scene = document.createElement("canvas"), sctx = scene.getContext("2d");
let ground = null, groundKey = "", props = [];
const spriteCache = new Map();

function hash(s) { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let s = seed >>> 0 || 1; return () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296; }
function noise2(x, y) { let h = Math.imul(x, 374761393) + Math.imul(y, 668265263); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function mix(a, b, t) { return a.map((v, i) => Math.round(v + (b[i] - v) * t)); }
function hexRgb(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function rgb(c, a = 1) { return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function wrapD(d, n) { d = ((d % n) + n) % n; return d > n / 2 ? d - n : d; }

// =============================================================================================
// Time: where we are in their week and their day
// =============================================================================================
function weekProgress(t) {
  if (liveMode && clock) return clamp((Date.now() / 1000 + clockOffset - clock.last) / clock.period, 0, 0.99999);
  return clamp((t - frameAt) / interval, 0, 0.99999);
}
function dayOf(wp) { const d = wp * 7, day = Math.floor(d); return {day, f: d - day}; }
function darkness(f) {
  if (!liveMode) return 0;
  if (f < 0.08) return 0.62 * (1 - f / 0.08);
  if (f < 0.70) return 0;
  if (f < 0.80) return 0.62 * (f - 0.70) / 0.10;
  return 0.62;
}
function phaseOf(f) {
  if (!liveMode) return f < 0.15 ? "go" : "work";
  if (f < 0.06 || f >= 0.86) return "sleep";
  if (f < 0.12) return "wake";
  if (f < 0.22) return "go";
  if (f < 0.70) return "work";
  if (f < 0.80) return "return";
  return "evening";
}
function clockOf(f) {
  // Their day as a clock face for us: first light at five, sunset at seven, night from half past eight.
  const pts = [[0, 5], [0.08, 6.5], [0.70, 19], [0.80, 20.5], [1, 29]];
  let h = 5;
  for (let k = 1; k < pts.length; k++) if (f <= pts[k][0]) { const [a, ha] = pts[k - 1], [b, hb] = pts[k]; h = ha + (hb - ha) * (f - a) / (b - a); break; }
  const mins = Math.floor((h % 24) * 60);
  return String(Math.floor(mins / 60)).padStart(2, "0") + ":" + String(mins % 60).padStart(2, "0");
}
function partOfDay(f) { return f < 0.08 ? "dawn" : f < 0.3 ? "morning" : f < 0.45 ? "midday" : f < 0.7 ? "afternoon" : f < 0.8 ? "evening" : "night"; }
function span(s) { const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return h ? `${h} h ${m} min` : m ? `${m} min` : `${Math.round(s)} s`; }
const DAYS = ["first", "second", "third", "fourth", "fifth", "sixth", "seventh"];
function at(day, f, now, len) { return now.day === day && now.f >= f && now.f < f + len; }
function past(day, f, now) { return now.day > day || (now.day === day && now.f >= f); }

// =============================================================================================
// Where things stand on each tile (fixed per tile, so a place looks the same every visit)
// =============================================================================================
function buildFeatures() {
  feats = [];
  for (let i = 0; i < W * H; i++) {
    const r = rng(hash("tile" + i));
    const j = (x, y, s = 0.05) => [x + (r() - 0.5) * s * 2, y + (r() - 0.5) * s * 2];
    feats.push({
      trees: [j(0.2, 0.36), j(0.5, 0.24), j(0.8, 0.38), j(0.9, 0.62)],
      bushes: [j(0.66, 0.6), j(0.84, 0.86), j(0.44, 0.5)],
      rocks: [j(0.14, 0.9), j(0.3, 0.97), j(0.08, 0.72)],
      tufts: Array.from({length: 14}, () => [0.04 + r() * 0.92, 0.06 + r() * 0.9]),
      flowers: Array.from({length: 7}, () => [0.06 + r() * 0.88, 0.3 + r() * 0.66, Math.floor(r() * 4)]),
      camp: [0.52, 0.76], hut: [0.3, 0.66], fire: [0.6, 0.84], stash: [0.84, 0.74],
      field: [0.05, 0.68, 0.4, 0.28],
    });
  }
}
function tileOf(x, y) { return ((((Math.floor(y) % H) + H) % H) * W) + (((Math.floor(x) % W) + W) % W); }

// =============================================================================================
// Pixel drawing helpers
// =============================================================================================
function R(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), w, h); }
function disk(c, cx, cy, r, col) { for (let dy = -r; dy <= r; dy++) { const w = Math.floor(Math.sqrt(r * r - dy * dy) + 0.35); R(c, cx - w, cy + dy, 2 * w + 1, 1, col); } }
function oval(c, cx, cy, rx, ry, col) { for (let dy = -ry; dy <= ry; dy++) { const w = Math.floor(rx * Math.sqrt(Math.max(0, 1 - (dy * dy) / (ry * ry))) + 0.35); R(c, cx - w, cy + dy, 2 * w + 1, 1, col); } }
function tri(c, cx, top, half, height, col) { for (let k = 0; k <= height; k++) { const w = Math.round(half * k / height); R(c, cx - w, top + k, 2 * w + 1, 1, col); } }
function line(c, x0, y0, x1, y1, col) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) || 1;
  for (let k = 0; k <= n; k++) R(c, x0 + (x1 - x0) * k / n, y0 + (y1 - y0) * k / n, 1, 1, col);
}
/** Give a sprite its dark outline: every empty pixel touching a filled one turns dark. */
function outline(cv, col = OUT) {
  const g = cv.getContext("2d"), w = cv.width, h = cv.height;
  const img = g.getImageData(0, 0, w, h), d = img.data, [r, gg, b] = hexRgb(col), edge = [];
  const solid = (x, y) => x >= 0 && y >= 0 && x < w && y < h && d[(y * w + x) * 4 + 3] > 140;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (solid(x, y)) continue;
    if (solid(x - 1, y) || solid(x + 1, y) || solid(x, y - 1) || solid(x, y + 1)) edge.push((y * w + x) * 4);
  }
  for (const o of edge) { d[o] = r; d[o + 1] = gg; d[o + 2] = b; d[o + 3] = 255; }
  g.putImageData(img, 0, 0);
  return cv;
}
function sprite(key, w, h, draw, line_ = true) {
  let s = spriteCache.get(key);
  if (!s) {
    s = document.createElement("canvas"); s.width = w; s.height = h;
    draw(s.getContext("2d"));
    if (line_) outline(s);
    spriteCache.set(key, s);
  }
  return s;
}
function shadow(c, x, y, rx, ry) { c.globalAlpha = 0.28; oval(c, x, y, rx, ry, "#1d2414"); c.globalAlpha = 1; }

// ---- trees, bushes, rocks -------------------------------------------------------------------
const LEAVES = {
  spring: [["#3f7f37", "#5aa046", "#7cc256", "#b3e27a"], ["#3f7f37", "#5aa046", "#7cc256", "#b3e27a"]],
  summer: [["#2a6230", "#3c8239", "#55a046", "#86c75c"], ["#2a6230", "#3c8239", "#55a046", "#86c75c"]],
  autumn: [["#8a3a1d", "#c2532b", "#e0832f", "#f3be55"], ["#8f6219", "#c58d22", "#e6b739", "#f6dc78"]],
};
function treeSprite(season, v) {
  return sprite(`tree|${season}|${v}`, 36, 46, g => {
    const rr = rng(v * 7919 + 13);
    R(g, 15, 30, 6, 14, "#7a4f2c"); R(g, 19, 30, 2, 14, "#5e3b1f"); R(g, 13, 42, 10, 2, "#6a4426");
    if (season === "winter") {
      for (const [x0, y0, x1, y1] of [[18, 31, 9, 14], [18, 30, 27, 13], [18, 28, 18, 6], [13, 22, 7, 19], [23, 20, 30, 17]]) {
        line(g, x0, y0, x1, y1, "#6b4a2e"); line(g, x0 + 1, y0, x1 + 1, y1, "#6b4a2e");
      }
      R(g, 8, 13, 3, 1, "#ffffff"); R(g, 26, 12, 3, 1, "#ffffff"); R(g, 17, 5, 3, 1, "#ffffff");
      return;
    }
    const [dk, md, lt, hl] = LEAVES[season][v % 2];
    disk(g, 18, 19, 13, dk); disk(g, 10, 23, 8, dk); disk(g, 26, 23, 8, dk);
    disk(g, 17, 17, 12, md); disk(g, 10, 21, 7, md); disk(g, 25, 21, 7, md);
    disk(g, 14, 12, 6, lt); disk(g, 8, 19, 3, lt); disk(g, 22, 15, 3, lt);
    for (let k = 0; k < 26; k++) { const a = rr() * TAU, d = rr() * 11; R(g, 17 + Math.cos(a) * d, 18 + Math.sin(a) * d, 1, 1, rr() < 0.5 ? dk : lt); }
    R(g, 12, 9, 2, 1, hl); R(g, 11, 10, 1, 1, hl); R(g, 21, 12, 1, 1, hl);
    if (season === "spring" && v % 3 === 0) for (let k = 0; k < 10; k++) R(g, 8 + rr() * 20, 8 + rr() * 18, 1, 1, rr() < 0.5 ? "#f7c6d9" : "#ffffff");
    if (season === "summer" && v % 4 === 1) for (let k = 0; k < 5; k++) R(g, 9 + rr() * 18, 12 + rr() * 14, 2, 2, "#d23a3a");
  });
}
function pineSprite(season, v) {
  return sprite(`pine|${season}|${v}`, 30, 48, g => {
    R(g, 13, 38, 4, 8, "#6a4426"); R(g, 15, 38, 2, 8, "#55361d");
    const tiers = [[14, 3, 7, 12], [14, 11, 10, 14], [14, 21, 13, 17]];
    for (const [cx, top, half, ht] of tiers) {
      tri(g, cx, top, half, ht, "#1f5240"); tri(g, cx - 1, top + 1, half - 2, ht - 2, "#2c6d50");
      tri(g, cx - 2, top + 3, Math.max(1, half - 6), ht - 6, "#3f8a62");
      if (season === "winter") { tri(g, cx, top, Math.floor(half / 2), Math.floor(ht / 2), "#ffffff"); }
    }
    if (season !== "winter") { R(g, 10, 14, 1, 1, "#5fae7c"); R(g, 8, 26, 1, 1, "#5fae7c"); }
  });
}
function bushSprite(season, berries, v) {
  return sprite(`bush|${season}|${berries}|${v}`, 22, 17, g => {
    if (season === "winter") {
      for (const [x1, y1] of [[4, 4], [8, 2], [12, 1], [16, 3], [19, 6]]) line(g, 11, 15, x1, y1, "#6b5440");
      R(g, 7, 2, 3, 1, "#ffffff"); R(g, 14, 1, 3, 1, "#ffffff");
      return;
    }
    const [dk, md, lt] = season === "autumn" ? ["#5f6a26", "#7f8a32", "#a2ad48"] : ["#2b6a2c", "#3f8a39", "#62ac4c"];
    disk(g, 7, 10, 5, dk); disk(g, 15, 10, 5, dk); disk(g, 11, 7, 6, dk);
    disk(g, 7, 9, 4, md); disk(g, 15, 9, 4, md); disk(g, 11, 6, 5, md);

// Each frame: compose the pixel scene, scale it up, then draw words on top

function draw(t) {

      if (r[P.stage] !== 0 || !plan.goals.has(r[P.carer])) continue;
      if (r.born && !past(r.born[0], r.born[1], plan.now)) continue;
      plan.goals.get(r[P.carer]).baby = true;
    }
    if (cam.follow && bodies.has(cam.follow)) {
      const b = bodies.get(cam.follow);
      cam.x += (b.x - cam.vw / cam.z / 2 - cam.x) * Math.min(1, dt * 2); cam.y += (b.y - cam.vh / cam.z / 2 - cam.y) * Math.min(1, dt * 2); clampCam();

const FONT = "\"Pixelify Sans\",\"Courier New\",monospace";

    const w = ctx.measureText(text).width + 10;

  }
  for (const [id, b] of bodies) {
    const r = rows.get(id); if (!r) continue;
    const sel = id === selected;
    mctx.fillStyle = OUT; mctx.fillRect(b.x * k - (sel ? 3 : 2), b.y * k - (sel ? 3 : 2), sel ? 6 : 4, sel ? 6 : 4);
    mctx.fillStyle = sel ? "#ffd23f" : LINE[r[P.line] % LINE.length]; mctx.fillRect(b.x * k - (sel ? 2 : 1), b.y * k - (sel ? 2 : 1), sel ? 4 : 2, sel ? 4 : 2);
  }
  mctx.strokeStyle = "#fff8e6"; mctx.lineWidth = 2;
  mctx.strokeRect(cam.x * k, cam.y * k, Math.min(W, cam.vw / cam.z) * k, Math.min(H, cam.vh / cam.z) * k);
}
function miniJump(ev) {
  const r = mini.getBoundingClientRect(), k = r.width / Math.max(W, H), wx = (ev.clientX - r.left) / k, wy = (ev.clientY - r.top) / k;
  if (cam.z / TP < 1.5) cam.z = 2 * TP;
  cam.follow = null; cam.x = wx - cam.vw / cam.z / 2; cam.y = wy - cam.vh / cam.z / 2; clampCam(); hideHelp();
}
let miniDrag = false;
mini.addEventListener("pointerdown", ev => { miniDrag = true; mini.setPointerCapture(ev.pointerId); miniJump(ev); });
mini.addEventListener("pointermove", ev => { if (miniDrag) miniJump(ev); });
mini.addEventListener("pointerup", () => { miniDrag = false; });

// =============================================================================================
// Frames from the world
// =============================================================================================
let talkLog = [], talkKey = "", camReady = false;
function nameOf(id) { const r = rows.get(id); return r ? r[P.name] : ""; }
function onFrame(f) {
  const now = performance.now();
  if (f.clock) { clock = f.clock; clockOffset = f.now - Date.now() / 1000; }
  interval = f.wps > 0 ? Math.min(1000, 1000 / f.wps) : 1000;
  const prevT = frame ? frame.t : -1;
  frame = f; frameAt = now;
  if (f.t !== prevT) {
    if (prevT >= 0) for (const s of says) talkLog.push([prevT, s[4], s[5], s[0], s[1], nameOf(s[1]), s[2] ? nameOf(s[2]) : "", s[3]]);
    if (talkLog.length > 400) talkLog.splice(0, talkLog.length - 400);
    rows = new Map();
    for (const r of f.people) rows.set(r[P.id], r);
    says = f.says || []; moments = f.moments || []; hunts = f.hunts || [];
    evening = f.evening || []; animals = f.animals || [];
    talks = f.talks || groupSays(says);
    heard = []; heardKeys = new Set();
    for (const m of moments) if (m[0] === "birth" && rows.has(m[2])) rows.get(m[2]).born = [m[5], m[6]];
    for (const d of f.dead || []) {   // they are still alive at the start of the week
      const [id, name, x, y, sex, stage, line_, cause, day, ff] = d;
      const row = [id, name, x, y, x, y, sex, stage, "rest", "", line_, "", "", 0.3, cause === "illness" ? 1 : 0, cause === "starvation" ? 1 : 0, 0, 0, 20, "", 30];
      row.dies = [day, ff];
      rows.set(id, row);
      graves.push({x: x + 0.7, y: y + 0.9, name, t: f.t, day, f: ff});
    }
    graves = graves.filter(g => f.t - g.t < 52);
  }
  document.getElementById("pop").textContent = f.pop;
  document.getElementById("gen").textContent = f.gen;
  const wet = f.sky ? f.sky.wet : 1;
  document.getElementById("wx").textContent = (wet < 0.65 ? "dry" : wet > 1.1 ? "wet" : "fair") + (f.sky && f.sky.storm ? " · storm" : f.sky && f.sky.flood ? " · flood" : f.sky && f.sky.rain ? " · rain" : "");
  if (!liveMode) { document.getElementById("date").textContent = `Year ${f.year} · week ${f.week + 1} · ${f.season}`; markSpeed(f.wps); }
  if (f.news && f.news.length) addNews(f.news, true);
  if (!camReady && f.people.length) { cam.z = cam.fit; clampCam(); camReady = true; }
}
function coupleTalk() {
  // Couples say goodnight at the camp even in a week saved before evening talk existed.
  const out = [];
  for (const r of rows.values()) if (r[P.partner] && r[P.partner] > r[P.id] && rows.has(r[P.partner]))
    out.push([r[P.id], r[P.partner], [[r[P.id], "Good night.", "chat"], [r[P.partner], "Sleep well.", "chat"]]]);
  return out;
}
function groupSays(list) {
  const pairs = new Map();
  for (const [kind, a, b, text, day, f] of [...list].sort((x, y) => (x[4] - y[4]) || (x[5] - y[5]))) {
    if (!b || kind === "think") continue;
    const key = a < b ? a + "|" + b : b + "|" + a;
    if (!pairs.has(key)) pairs.set(key, [a, b, []]);
    pairs.get(key)[2].push([a, text, kind]);
  }
  return [...pairs.values()];
}
let lastClockText = "";
function updateClock(plan) {
  if (!liveMode || !clock) return;
  const now = Date.now() / 1000 + clockOffset, next = Math.max(0, clock.last + clock.period - now), dayLen = clock.period / 7;
  const text = `${clockOf(plan.now.f)} · ${partOfDay(plan.now.f)} · ${DAYS[plan.now.day]} day of the week · ${frame.season}, year ${frame.year}`;
  const pace = Math.abs(dayLen - 3600) < 1 ? "1 hour here is 1 day there" : `${span(dayLen)} here is 1 day there`;
  const sub = `${pace} · next week begins in ${span(next)}`;
  if (text + sub !== lastClockText) { document.getElementById("date").textContent = text; document.getElementById("clock").textContent = sub; lastClockText = text + sub; }
}
function setSpeed(wps) { fetch("/speed?wps=" + wps); markSpeed(wps); }
function markSpeed(wps) { document.querySelectorAll("#speed button").forEach(b => b.classList.toggle("on", Number(b.dataset.w) === wps)); }
[["Pause", 0], ["1", 1], ["4", 4], ["16", 16], ["52", 52]].forEach(([label, w]) => {
  const b = document.createElement("button"); b.textContent = label; b.dataset.w = w;
  b.addEventListener("click", () => setSpeed(w)); document.getElementById("speed").appendChild(b);
});
function addNews(items, fresh) {
  const box = document.getElementById("news");
  for (const e of items) {
    if (e.kind === "band" || e.kind === "leader") continue;
    const p = document.createElement("p"), y = document.createElement("span");
    y.className = "y"; y.textContent = "Year " + e.year;
    p.append(y, document.createTextNode(e.text));
    if (["invention", "first", "settlement", "revenge", "feud", "loss"].includes(e.kind)) p.classList.add("big");
    box.prepend(p);
    if (fresh && ["invention", "first", "settlement", "revenge", "feud"].includes(e.kind)) showBanner(e.text);
  }
  while (box.children.length > 60) box.lastChild.remove();
}
let bannerTimer = null;
function showBanner(text) { banner.textContent = text; banner.classList.add("show"); clearTimeout(bannerTimer); bannerTimer = setTimeout(() => banner.classList.remove("show"), 6000); }

// =============================================================================================
// Looking closer
// =============================================================================================
function find(sx, sy) {
  let best = null, bd = Math.max(14, cam.z * 0.3) ** 2;
  for (const [id, b] of bodies) {
    const [px, py] = toScreen(b.x, b.y), dx = px - sx, dy = (py - 10 * cam.z / TP) - sy, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = id; }
  }
  return best;
}
const DOING = {rest: "resting", forage: "picking berries and plants", hunt: "hunting", "gather wood": "gathering wood",
  "gather stone": "gathering stones", "gather flint": "gathering flint", "gather fiber": "gathering fiber",
  take: "fetching food left earlier", make: "making something again", play: "fiddling with things to see what happens",
  explore: "exploring", give: "giving food", care: "looking after someone", talk: "talking", court: "courting",
  steal: "stealing", attack: "fighting", flee: "running away", join: "heading to someone"};
const STAGE = ["baby", "child", "teenager", "adult", "elder"];
function showTip(h) {
  const id = find(h.sx, h.sy);
  h.id = id;
  tip.replaceChildren();
  if (!id || !rows.has(id)) { tip.style.display = "none"; return; }
  const r = rows.get(id);
  const add = (text, cls) => { const d = document.createElement("div"); if (cls) d.className = cls; d.textContent = text; tip.appendChild(d); };
  add(`${r[P.name]}, ${STAGE[r[P.stage]]}, ${Math.floor(r[P.age])}`, "t");
  const doing = r[P.doing] || "", what = doing.startsWith("put") ? "setting down " + doing.split(" ")[1] : DOING[doing] || "being looked after";
  const ph = lastPlan ? lastPlan.phase : "work";
  add(ph === "sleep" ? "asleep" : ph === "evening" ? "resting by the camp" : `this week: ${what}`, "s");
  if (r[P.items]) add("carries " + r[P.items].split(",").map(c => ({wrap: "a fur wrap", spear: "a spear", blade: "a blade", carrier: "a basket", club: "a club"}[c] || c)).join(", "), "s");
  if (r[P.sick]) add("sick", "s"); if (r[P.starving]) add("hungry", "s"); if (r[P.grief]) add("grieving", "s");
  if (r[P.mind]) add("on their mind: " + r[P.mind] + (r[P.state] ? ` (${r[P.state]})` : ""), "s");
  add("click to follow", "s");
  tip.style.display = "block";
  const st = document.getElementById("stage").getBoundingClientRect();
  let left = h.cx - st.left + 14;
  if (left + tip.offsetWidth > st.width) left = h.cx - st.left - tip.offsetWidth - 14;
  tip.style.left = left + "px"; tip.style.top = (h.cy - st.top + 14) + "px";
}
function follow(id) {
  selected = id; cam.follow = id;
  if (cam.z / TP < 1.5) { const b = bodies.get(id); cam.z = 2 * TP; if (b) { cam.x = b.x - cam.vw / cam.z / 2; cam.y = b.y - cam.vh / cam.z / 2; } clampCam(); }
  clearInterval(selectedTimer);
  const load = () => fetch("/person?id=" + encodeURIComponent(id)).then(r => r.json()).then(renderPerson);
  load(); selectedTimer = setInterval(load, 4000);
}
function renderPerson(d) {
  const box = document.getElementById("person");
  box.replaceChildren();
  if (!d || !d.id) return;
  const card = document.createElement("div"); card.className = "person";
  const close = document.createElement("button"); close.textContent = "×"; close.title = "Stop following";
  close.addEventListener("click", () => { selected = null; cam.follow = null; clearInterval(selectedTimer); box.replaceChildren(); });
  const h = document.createElement("h3"); h.textContent = d.name;
  const sub = document.createElement("div"); sub.className = "sub";
  sub.textContent = d.alive ? `${d.age} years old · generation ${d.generation} · health ${d.health} · mood ${d.mood}` : `died: ${d.death}`;
  card.append(close, h, sub);
  const section = (title, items) => {
    if (!items || !items.length) return;
    const k = document.createElement("div"); k.className = "k"; k.textContent = title;
    const ul = document.createElement("ul");
    for (const it of items) { const li = document.createElement("li"); li.textContent = it; ul.appendChild(li); }
    card.append(k, ul);
  };
  const fam = [];
  if (d.mother || d.father) fam.push("child of " + [d.mother, d.father].filter(Boolean).join(" and "));
  if (d.partner) fam.push("partner of " + d.partner);
  if (d.children.length) fam.push("children: " + d.children.join(", "));
  section("Family", fam);
  const t = d.temperament, traits = [];
  const word = (v, hi, lo) => v > 0.7 ? hi : v < 0.3 ? lo : null;
  [["curiosity", "very curious", "incurious"], ["kindness", "kind", "unkind"], ["temper", "hot-tempered", "calm"],
   ["sociability", "sociable", "solitary"], ["care", "a devoted carer", "a distant carer"], ["boldness", "bold", "timid"],
   ["diligence", "hard-working", "easy-going"], ["anxiety", "anxious", "unflappable"]].forEach(([g, hi, lo]) => { const w = word(t[g], hi, lo); if (w) traits.push(w); });
  section("Nature", traits.length ? [traits.join(", ")] : ["nothing extreme"]);
  const m = d.mind;
  if (m) {
    const bar = v => "▮".repeat(Math.max(1, Math.min(6, Math.round(v * 4))));
    const head = m.state ? ` · ${m.state}, ${m.weeks} weeks on the same thing` : "";
    section("On their mind" + head, m.thoughts.map(t => `${bar(t.pull)} ${t.text}`));
    section("Weighed this week", m.weighed.map(w => `${w.chosen ? "▶" : "·"} ${w.text} (${w.score})`));
    section("Puzzling over", m.puzzles.map(z => `${z.text}${z.tests ? ` · tried again ${z.tests}×` : ""}`));
    section("Told, not yet tried", m.heard);
    section("Whose word they trust", m.records || []);
    section("Marks they know", m.marks.map(k => `<${k.shape}> seen ${k.seen}× · ${k.goes_with ? "goes with " + k.goes_with : "means nothing to them yet"}`));
    const fe = m.feelings;
    section("Feelings", [`mood ${fe.mood} · fear ${fe.fear} · anger ${fe.anger} · grief ${fe.grief} · lonely ${fe.loneliness}` + (fe.thirst ? ` · thirst ${fe.thirst}` : "")]);
  }
  section("Remembers", d.memories);
  section("Knows how to make", d.makes.map(m => `${m.what}: ${m.how}`));
  section("Has come to believe", d.beliefs);
  const carry = Object.entries(d.carrying).filter(([, v]) => v > 0).map(([k, v]) => `${v} ${k}`);
  section("Carrying", [...d.things, ...(carry.length ? [carry.join(", ")] : [])]);
  box.appendChild(card);
}

// =============================================================================================
// Start
// =============================================================================================
fetch("/terrain").then(r => r.json()).then(t => {
  terrain = t; W = t.width; H = t.height;
  liveMode = !!t.live;
  talkLog = t.log || [];
  document.getElementById("title").textContent = liveMode ? "Their world" : "Seed " + t.seed;
  if (liveMode) { document.getElementById("speed").hidden = true; document.getElementById("clock").hidden = false; }
  buildFeatures();
  resize();
  addNews(t.chronicle, false);
  const es = new EventSource("/stream");
  es.onmessage = ev => onFrame(JSON.parse(ev.data));
  es.onerror = () => { document.getElementById("date").textContent = "connection lost, retrying…"; };
  requestAnimationFrame(t2 => { lastT = t2; draw(t2); });
});
</script>
